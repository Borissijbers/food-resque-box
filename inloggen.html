<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inloggen - Food Rescue Box</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🥕 Food Rescue Box</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="informatie.html">Meer informatie</a>
            <a href="faq.html">FAQ</a>
            <a href="account.html">Mijn account</a>
            <a href="inloggen.html">Inloggen</a>
        </nav>
    </header>


    <main>

        <section class="login-section">

            <div class="login-box">

                <h1>👤 Inloggen</h1>

                <p>
                    Log in om je reserveringen en toegangscodes te bekijken.
                </p>

                <form id="loginForm">

                    <label for="email">E-mailadres</label>
                    <input type="email" id="loginEmail" placeholder="jouw@email.nl" required>

                    <label for="wachtwoord">Wachtwoord</label>
                    <input type="password" id="loginWachtwoord" placeholder="Wachtwoord" required>

                    <button type="submit">
                        Inloggen
                    </button>

                </form>

                <p id="loginFout"></p>
                <p>
                    Nog geen account?
                    <a href="aanmelden.html">Account aanmaken</a>
                </p>

            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 Food Rescue Box | SDG 2 - Geen honger</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
